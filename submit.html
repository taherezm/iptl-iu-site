<section class="page-hero" data-screen-label="Submit Hero">
  <div class="wrap">
    <span class="eyebrow">Open Call · Research &amp; Writing</span>
    <h1 data-reveal>Submit your work for publication.</h1>
  </div>
</section>

<section class="form-section" data-screen-label="Submit Form">
  <div class="wrap">
    <form class="form basin-form"
          name="research-submission"
          method="POST"
          action="https://usebasin.com/f/eda739bd091b"
          accept-charset="UTF-8"
          enctype="multipart/form-data">
      <input type="hidden" name="subject" value="New publication submission">
      <p class="hp-field" aria-hidden="true">
        <label>Don't fill this out if you're human: <input name="_gotcha" tabindex="-1" autocomplete="off"></label>
      </p>

      <div class="row">
        <div class="field">
          <label for="s-name">Author name</label>
          <input id="s-name" name="name" type="text" placeholder="First Last" required="" autocomplete="name">
        </div>
        <div class="field">
          <label for="s-email">IU email</label>
          <input id="s-email" name="email" type="email" placeholder="you@iu.edu" required="" autocomplete="email">
        </div>
      </div>

      <div class="field">
        <label for="s-title">Piece title</label>
        <input id="s-title" name="piece-title" type="text" placeholder="Working title is fine" required="">
      </div>

      <div class="row">
        <div class="field">
          <label for="s-topic">Topic area</label>
          <select id="s-topic" name="topic-area">
            <option value="" disabled="" selected="">Select…</option>
            <option value="Copyright">Copyright</option>
            <option value="Patent">Patent</option>
            <option value="Trademark">Trademark</option>
            <option value="AI &amp; the law">AI &amp; the law</option>
            <option value="Platform regulation">Platform regulation</option>
            <option value="Privacy &amp; data">Privacy &amp; data</option>
            <option value="Open source &amp; licensing">Open source &amp; licensing</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div class="field">
          <label for="s-coauthors">Co-authors <span style="text-transform:none; letter-spacing:0; color: var(--ink-faint)">— optional</span></label>
          <input id="s-coauthors" name="co-authors" type="text" placeholder="Names, separated by commas">
        </div>
      </div>

      <div class="field">
        <label for="s-abstract">Abstract or summary</label>
        <textarea id="s-abstract" name="abstract" placeholder="A paragraph or two. What is the piece arguing, and what does a reader walk away knowing?" required=""></textarea>
      </div>

      <div class="field file-field">
        <label for="s-file">Manuscript file</label>
        <input id="s-file" name="submission-file" type="file" accept=".pdf,.doc,.docx,.txt,.md,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document">
        <span class="file-hint">PDF, DOC, DOCX, MD or TXT</span>
      </div>

      <button class="submit" type="submit">
        <span>Submit for publication</span>
        <span class="arrow" aria-hidden="true">→</span>
      </button>
      <div class="form-status" role="status" aria-live="polite"></div>
    </form>
  </div>
</section>

<footer>
  <div class="wrap foot-row">
