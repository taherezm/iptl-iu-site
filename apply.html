<section class="page-hero" data-screen-label="Apply Hero">
  <div class="wrap">
    <h1>Apply to be a member</h1>
  </div>
</section>

<section class="form-section" data-screen-label="Apply Form">
  <div class="wrap">
    <form class="form basin-form"
          name="membership"
          method="POST"
          action="https://usebasin.com/f/e2032128a50b"
          accept-charset="UTF-8"
          enctype="multipart/form-data">
      <input type="hidden" name="subject" value="New membership application">
      <p class="hp-field" aria-hidden="true">
        <label>Don't fill this out if you're human: <input name="_gotcha" tabindex="-1" autocomplete="off"></label>
      </p>

      <div class="row">
        <div class="field">
          <label for="m-name">Full name</label>
          <input id="m-name" name="name" type="text" placeholder="First Last" required="" autocomplete="name">
        </div>
        <div class="field">
          <label for="m-email">IU email</label>
          <input id="m-email" name="email" type="email" placeholder="you@iu.edu" required="" autocomplete="email">
        </div>
      </div>

      <div class="row">
        <div class="field">
          <label for="m-year">Class standing</label>
          <select id="m-year" name="class-standing" required="">
            <option value="" disabled="" selected="">Select…</option>
            <option value="Freshman">Freshman</option>
            <option value="Sophomore">Sophomore</option>
            <option value="Junior">Junior</option>
            <option value="Senior">Senior</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div class="field">
          <label for="m-track">What are you applying for?</label>
          <select id="m-track" name="application-track" required="">
            <option value="" disabled="" selected="">Select…</option>
            <option value="Researcher">Researcher</option>
            <option value="Leadership">Leadership</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label for="m-major">Major(s), Minor(s)</label>
        <input id="m-major" name="major" type="text" placeholder="e.g. Informatics, Philosophy">
      </div>

      <div class="field file-field">
        <label for="m-resume">Resume</label>
        <input id="m-resume" name="resume" type="file" accept=".pdf,.doc,.docx" required="">
        <span class="file-hint">One Page PDF Preferred</span>
      </div>

      <button class="submit" type="submit">
        <span>Submit application</span>
        <span class="arrow" aria-hidden="true">→</span>
      </button>
      <div class="form-status" role="status" aria-live="polite"></div>
    </form>
  </div>
</section>

<footer>
  <div class="wrap foot-row">
    <span class="disclosure">Not affiliated with Indiana University Maurer School of Law</span>
    <span class="links">
      <a href="index.html#focus">Focus</a>

      <a href="apply.html">Apply</a>
      <a href="submit.html">Submit</a>
    </span>
  </div>
</footer>
