<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apply · IP &amp; Technology Law at IU</title>
<link rel="stylesheet" href="site-chrome.css">
<link rel="stylesheet" href="theme-toggle.css">
<script src="theme-toggle.js"></script>
</head>
<body>

<div class="bg" aria-hidden="true">
  <div class="orb a"></div>
  <div class="orb b"></div>
  <div class="orb c"></div>
</div>
<div class="cursor-glow" aria-hidden="true"></div>

<header class="nav">
  <div class="wrap nav-inner">
    <a href="index.html" class="brand" aria-label="ip&amp;tl@iu">
      <span class="slash" aria-hidden="true"></span>
      <span class="name">ip&amp;tl@iu</span>
    </a>
    <nav class="nav-links">
      <a href="index.html#focus">Focus</a>
      <a href="blog.html">Blog</a>
      <a href="index.html#people">People</a>
      <a href="index.html#contact">Contact</a>
      <a href="tools/litigation-tracker/">Tools</a>
    </nav>
  </div>
</header>

<section class="page-hero" data-screen-label="Apply Hero">
  <div class="wrap">
    <span class="eyebrow">Membership · Fall 2026</span>
    <h1 data-reveal>Apply to be a member</h1>
  </div>
</section>

<section class="form-section" data-screen-label="Apply Form">
  <div class="wrap">
    <form class="form netlify-form"
          name="membership"
          method="POST"
          action="/"
          enctype="multipart/form-data"
          data-netlify="true"
          data-netlify-honeypot="bot-field">
      <input type="hidden" name="form-name" value="membership">
      <p class="hp-field" aria-hidden="true">
        <label>Don't fill this out if you're human: <input name="bot-field" tabindex="-1" autocomplete="off"></label>
      </p>

      <div class="row">
        <div class="field">
          <label for="m-name">Full name</label>
          <input id="m-name" name="full-name" type="text" placeholder="First Last" required="" autocomplete="name">
        </div>
        <div class="field">
          <label for="m-email">IU email</label>
          <input id="m-email" name="email" type="email" placeholder="you@iu.edu" required="" autocomplete="email">
        </div>
      </div>

      <div class="row">
        <div class="field">
          <label for="m-year">Class standing</label>
          <select id="m-year" name="class-standing" required="">
            <option value="" disabled="" selected="">Select…</option>
            <option value="Freshman">Freshman</option>
            <option value="Sophomore">Sophomore</option>
            <option value="Junior">Junior</option>
            <option value="Senior">Senior</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div class="field">
          <label for="m-major">Major(s)</label>
          <input id="m-major" name="major" type="text" placeholder="e.g. Informatics, Philosophy">
        </div>
      </div>

      <div class="field file-field">
        <label for="m-resume">Resume</label>
        <input id="m-resume" name="resume" type="file" accept=".pdf,.doc,.docx" required="">
        <span class="file-hint">PDF or Word · One page preferred</span>
      </div>

      <button class="submit" type="submit">
        <span>Submit application</span>
        <span class="arrow" aria-hidden="true">→</span>
      </button>
      <div class="form-status" role="status" aria-live="polite"></div>
    </form>
  </div>
</section>

<footer>
  <div class="wrap foot-row">
    <span>IP &amp; TECHNOLOGY LAW AT IU · INDIANA UNIVERSITY BLOOMINGTON · 2026</span>
    <span class="links">
      <a href="index.html#focus">Focus</a>
      <a href="index.html#people">People</a>
      <a href="apply.html">Apply</a>
      <a href="submit.html">Submit</a>
    </span>
  </div>
</footer>

<script src="site.js"></script>
</body>
</html>
